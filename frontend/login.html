<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Padel Online</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        .divider span {
            padding: 0 10px;
            color: #666;
            font-size: 14px;
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .btn-google:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🎾 Padel Online</h1>
            <p>Inicia sesión para continuar</p>
        </div>
        
        <div id="message" class="message" style="display: none;"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="5512345678" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
                </div>
            </div>
            
            <div class="form-group" id="mfaGroup" style="display: none;">
                <label for="mfaToken">Código MFA</label>
                <input type="text" id="mfaToken" name="mfaToken" placeholder="123456" maxlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
        </form>
        
        <div class="divider">
            <span>o</span>
        </div>
        
        <a href="/api/auth/google" class="btn btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continuar con Google
        </a>
        
        <div class="loading" id="loading"></div>
        
        <div class="links">
            <p><a href="/recuperar">¿Olvidaste tu contraseña?</a></p>
            <p style="margin-top: 15px;">¿No tienes cuenta? <a href="/registro">Regístrate aquí</a></p>
        </div>
    </div>
    
    <script>
        // Advertencia de Self-XSS
        console.log('%c⚠️ ADVERTENCIA DE SEGURIDAD ⚠️', 'color: red; font-size: 20px; font-weight: bold;');
        console.log('%cNo pegues código JavaScript en esta consola. Podría comprometer tu cuenta.', 'color: orange; font-size: 14px;');
        console.log('%cSi alguien te pide que pegues código aquí, es un intento de ataque.', 'color: orange; font-size: 14px;');
        
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = event.target;
            
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '🔒';
            } else {
                input.type = 'password';
                button.textContent = '👁️';
            }
        }
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const telefono = document.getElementById('telefono').value;
            const password = document.getElementById('password').value;
            const mfaToken = document.getElementById('mfaToken').value;
            const loading = document.getElementById('loading');
            
            loading.classList.add('show');
            
            try {
                // Determinar si ya estamos en modo MFA
                const isMFAStep = document.getElementById('mfaGroup').style.display === 'block';
                
                let url, body;
                if (isMFAStep) {
                    url = '/api/auth/login-mfa';
                    body = { telefono, password, mfaToken };
                } else {
                    url = '/api/auth/login';
                    body = { telefono, password };
                }
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.mfaRequired) {
                        // Mostrar campo MFA
                        document.getElementById('mfaGroup').style.display = 'block';
                        document.getElementById('mfaToken').required = true;
                        document.getElementById('mfaToken').focus();
                        showMessage('Ingresa el código de tu aplicación autenticadora', 'success');
                    } else {
                        sessionStorage.setItem('user', JSON.stringify(data.user));
                        showMessage('¡Login exitoso! Redirigiendo...', 'success');
                        
                        setTimeout(() => {
                            window.location.href = '/dashboard.html';
                        }, 1500);
                    }
                } else {
                    showMessage(data.message || 'Error al iniciar sesión', 'error');
                }
            } catch (error) {
                showMessage('Error de conexión. Inténtalo nuevamente.', 'error');
            } finally {
                loading.classList.remove('show');
            }
        });
    </script>
</body>
</html>
