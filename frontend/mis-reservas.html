<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - Padel Online</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .dashboard-container {
            max-width: 1000px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .user-details h2 {
            color: #1a1a1a;
            margin-bottom: 5px;
        }
        
        .user-details p {
            color: #666;
            font-size: 0.9em;
        }
        
        .logout-btn {
            background: #1a1a1a;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: #333333;
            transform: translateY(-2px);
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: #f0f0f0;
            color: #1a1a1a;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover, .nav-btn.active {
            background: #1a1a1a;
            color: white;
        }
        
        .reservas-list {
            display: grid;
            gap: 20px;
        }
        
        .reserva-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid #1a1a1a;
            transition: all 0.3s ease;
        }
        
        .reserva-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .reserva-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .reserva-cancha {
            font-size: 1.3em;
            font-weight: bold;
            color: #1a1a1a;
        }
        
        .reserva-estado {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .estado-pendiente {
            background: #fff3cd;
            color: #856404;
        }
        
        .estado-confirmada {
            background: #d4edda;
            color: #155724;
        }
        
        .estado-cancelada {
            background: #f8d7da;
            color: #721c24;
        }
        
        .reserva-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .reserva-notas {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            color: #666;
        }
        
        .cancel-btn {
            background: #dc3545;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .cancel-btn:hover {
            background: #c82333;
        }
        
        .no-reservas {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .no-reservas h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #1a1a1a;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container dashboard-container">
        <div class="header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <h2 id="userName">Usuario</h2>
                    <p id="userPhone">Teléfono</p>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/dashboard.html'">Dashboard</button>
            <button class="nav-btn active" onclick="window.location.href='/mis-reservas.html'">Mis Reservas</button>
            <button class="nav-btn" onclick="window.location.href='/ver-canchas.html'">Ver Canchas</button>
            <button class="nav-btn" onclick="window.location.href='/nueva-reserva.html'">Nueva Reserva</button>
            <button class="nav-btn" onclick="window.location.href='/mi-perfil.html'">Mi Perfil</button>
        </div>
        
        <h1 style="color: #1a1a1a; margin-bottom: 30px;">📅 Mis Reservas</h1>
        
        <div id="loading" class="loading">
            <div class="loading show"></div>
            <p>Cargando reservas...</p>
        </div>
        
        <div id="reservasContainer" class="reservas-list" style="display: none;"></div>
    </div>
    
    <script>
        // Advertencia de Self-XSS
        console.log('%c⚠️ ADVERTENCIA DE SEGURIDAD ⚠️', 'color: red; font-size: 20px; font-weight: bold;');
        console.log('%cNo pegues código JavaScript en esta consola. Podría comprometer tu cuenta.', 'color: orange; font-size: 14px;');
        console.log('%cSi alguien te pide que pegues código aquí, es un intento de ataque.', 'color: orange; font-size: 14px;');
        
        let csrfToken = null;
        
        // Obtener token CSRF
        async function getCSRFToken() {
            try {
                const response = await fetch('/api/auth/csrf-token', {
                    credentials: 'include'
                });
                const data = await response.json();
                csrfToken = data.csrfToken;
            } catch (error) {
                console.error('Error al obtener token CSRF:', error);
            }
        }
        
        const user = JSON.parse(sessionStorage.getItem('user'));
        
        if (!user) {
            window.location.href = '/login';
        }
        
        document.getElementById('userName').textContent = user.nombre + ' ' + user.apellido;
        document.getElementById('userPhone').textContent = user.telefono;
        document.getElementById('userAvatar').textContent = user.nombre.charAt(0).toUpperCase();
        
        async function cargarReservas() {
            try {
                const response = await fetch('/api/reservas/mis-reservas', {
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                if (data.success && data.reservas.length > 0) {
                    const container = document.getElementById('reservasContainer');
                    container.style.display = 'grid';
                    
                    data.reservas.forEach(reserva => {
                        const estadoClass = `estado-${reserva.estado.toLowerCase().replace('_', '-')}`;
                        const puedeCancelar = reserva.estado === 'PENDIENTE_PAGO' || reserva.estado === 'CONFIRMADA';
                        
                        container.innerHTML += `
                            <div class="reserva-card">
                                <div class="reserva-header">
                                    <div class="reserva-cancha">${reserva.nombre_cancha}</div>
                                    <div class="reserva-estado ${estadoClass}">${reserva.estado.replace('_', ' ')}</div>
                                </div>
                                <div class="reserva-details">
                                    <div class="detail-item">
                                        <span class="detail-label">Fecha</span>
                                        <span class="detail-value">${new Date(reserva.fecha).toLocaleDateString('es-ES')}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">Hora</span>
                                        <span class="detail-value">${reserva.hora_inicio.substring(0, 5)} - ${reserva.hora_fin.substring(0, 5)}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">Duración</span>
                                        <span class="detail-value">${reserva.duracion_minutos} min</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">Precio</span>
                                        <span class="detail-value">$${reserva.precio_hora}/hora</span>
                                    </div>
                                </div>
                                ${reserva.notas ? `<div class="reserva-notas"><strong>Notas:</strong> ${reserva.notas}</div>` : ''}
                                ${puedeCancelar ? `
                                    <div style="margin-top: 15px;">
                                        <button class="cancel-btn" onclick="cancelarReserva(${reserva.id_reservacion})">Cancelar Reserva</button>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                } else {
                    document.getElementById('reservasContainer').innerHTML = `
                        <div class="no-reservas">
                            <h3>No tienes reservas</h3>
                            <p>¡Haz tu primera reserva ahora!</p>
                            <button class="btn btn-primary" style="margin-top: 20px; max-width: 200px;" onclick="window.location.href='/nueva-reserva.html'">Crear Reserva</button>
                        </div>
                    `;
                    document.getElementById('reservasContainer').style.display = 'block';
                }
            } catch (error) {
                console.error('Error al cargar reservas:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('reservasContainer').innerHTML = '<p style="text-align: center; color: #dc3545;">Error al cargar reservas</p>';
                document.getElementById('reservasContainer').style.display = 'block';
            }
        }
        
        async function cancelarReserva(id) {
            if (!confirm('¿Estás seguro de cancelar esta reserva?')) return;
            
            try {
                const response = await fetch(`/api/reservas/cancelar/${id}`, {
                    method: 'PUT',
                    headers: {
                        'X-CSRF-Token': csrfToken
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Reserva cancelada exitosamente');
                    cargarReservas();
                } else {
                    alert('Error al cancelar reserva: ' + data.message);
                }
            } catch (error) {
                console.error('Error al cancelar reserva:', error);
                alert('Error al cancelar reserva');
            }
        }
        
        function logout() {
            sessionStorage.removeItem('user');
            window.location.href = '/login';
        }
        
        // Inicializar
        getCSRFToken();
        cargarReservas();
    </script>
</body>
</html>
